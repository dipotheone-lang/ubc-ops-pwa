name: CI

# Gate every pull request (and pushes to main) on syntax + the test suites.
# No dependency install needed — the checks and tests are pure Node scripts.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check (all .gs/.js/.mjs)
        run: npm run check
      - name: Backend harness + offline-queue tests
        run: npm test
